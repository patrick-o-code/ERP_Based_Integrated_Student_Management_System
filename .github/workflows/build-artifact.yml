name: Build Artifact

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build assets (CSS & JS minification)
      run: npm run build
      continue-on-error: true  # Continue even if JS minification has issues
    
    - name: Check build output
      run: |
        echo "Checking minified CSS files..."
        ls -lah assets/themes/*/stylesheet.css || echo "CSS files not found"
        echo ""
        echo "Checking minified JS files..."
        ls -lah assets/js/plugins.min.js || echo "JS file not found"
    
    - name: Create artifact ZIP
      run: |
        mkdir -p build
        zip -r build/rosariosis-artifact.zip . \
          -x "node_modules/*" \
          ".git/*" \
          ".github/*" \
          "*.zip" \
          ".gitignore" \
          ".env*" \
          "build/*"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rosariosis-artifact-node${{ matrix.node-version }}
        path: build/rosariosis-artifact.zip
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        gh release create ${{ github.ref_name }} \
          build/rosariosis-artifact.zip \
          --title "Release ${{ github.ref_name }}" \
          --draft=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: build and push Docker image
      uses: mr-smithers-excellent/docker-build-push@v5
      with:
        image: prareek0yella/cloud_avengers
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true
